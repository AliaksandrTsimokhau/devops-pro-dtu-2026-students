.on-default:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.helm:
  image:
    name: $HELM_IMAGE
    entrypoint: [""]

.trivy:
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"

# Images are built and pushed without a Docker daemon, so the runner needs no privileged pods.
.buildah:
  image:
    name: $BUILDAH_IMAGE
    entrypoint: [""]
  variables:
    # vfs and chroot isolation need no privileges, device access or user namespaces.
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
  before_script:
    - 'command -v buildah >/dev/null || { echo "buildah is missing, because BUILDAH_IMAGE is not set and the job ran in the default image of the runner. Copy .gitlab-ci.yml together with .gitlab/ci/web.yml."; exit 1; }'

.skopeo:
  image:
    name: $SKOPEO_IMAGE
    entrypoint: [""]
  before_script:
    - 'command -v skopeo >/dev/null || { echo "skopeo is missing, because SKOPEO_IMAGE is not set and the job ran in the default image of the runner. Copy .gitlab-ci.yml together with .gitlab/ci/web.yml."; exit 1; }'

go-tests:
  stage: verify
  image: $GO_IMAGE
  script:
    - cd apps/web
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go test -race -coverprofile=coverage.out ./...
  artifacts:
    when: always
    paths: [apps/web/coverage.out]
    expire_in: 1 week

frontend-tests:
  stage: verify
  image: $NODE_IMAGE
  script:
    - node --check apps/web/web/app.js
    - node --test apps/web/frontend_test.mjs

chart-lint:
  extends: .helm
  stage: verify
  script:
    - helm lint charts/release-board --strict --namespace release-board-ci
    - helm lint charts/lab-access --strict --namespace gitlab-agent --set targetNamespace=full-cycle-999
    - helm template release-board charts/release-board --namespace release-board-ci > rendered.yaml
  artifacts:
    paths: [rendered.yaml]
    expire_in: 1 day

manifest-schema:
  stage: verify
  image:
    name: ghcr.io/yannh/kubeconform:v0.8.0-alpine
    entrypoint: [""]
  needs: [chart-lint]
  script:
    - kubeconform -strict -summary -kubernetes-version 1.36.0 rendered.yaml

security-source:
  extends: .trivy
  stage: verify
  script:
    - trivy fs --scanners vuln,secret --skip-dirs .git --severity HIGH,CRITICAL --exit-code 1 --format json --output security-source.json .
  artifacts:
    when: always
    paths: [security-source.json]
    expire_in: 1 week

security-config:
  extends: .trivy
  stage: verify
  needs: [chart-lint]
  script:
    - trivy config --severity HIGH,CRITICAL --exit-code 1 --format json --output security-dockerfile.json apps/web
    - trivy config --severity HIGH,CRITICAL --exit-code 1 --format json --output security-config.json rendered.yaml
  artifacts:
    when: always
    paths: [security-dockerfile.json, security-config.json]
    expire_in: 1 week

build-image:
  extends: .buildah
  stage: build
  script:
    - buildah build --format docker --build-arg APP_VERSION="$CI_COMMIT_SHA" --tag "$IMAGE_REF" apps/web
    # The image is saved as an archive: the same bytes are scanned and then published.
    - buildah push "$IMAGE_REF" "docker-archive:image.tar:$IMAGE_REF"
  artifacts:
    access: maintainer
    paths: [image.tar]
    expire_in: 1 day

scan-image:
  extends: .trivy
  stage: scan
  needs: [build-image]
  script:
    - trivy image --input image.tar --format cyclonedx --output sbom.cdx.json
    - trivy image --input image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output security-image.json
  artifacts:
    when: always
    paths: [security-image.json, sbom.cdx.json]
    expire_in: 1 week

publish-image:
  extends: [.skopeo, .on-default]
  stage: publish
  needs: [build-image, scan-image]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | skopeo login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - skopeo copy --digestfile digest.txt docker-archive:image.tar "docker://$IMAGE_REF"
    - 'printf "IMAGE_DIGEST=%s\n" "$(cat digest.txt)" > release.env'
    - cat release.env
  artifacts:
    paths: [release.env]
    reports:
      dotenv: release.env
    expire_in: 1 week

publish-chart:
  extends: [.helm, .on-default]
  stage: publish
  needs: [publish-image]
  script:
    - export CHART_VERSION="0.${CI_PIPELINE_IID}.${CI_JOB_ID}"
    - sh ci/package-chart.sh
    - helm lint dist/release-board --strict --namespace release-board-ci
    - helm package dist/release-board --version "$CHART_VERSION" --app-version "$CI_COMMIT_SHA" --destination dist
    - echo "$CI_REGISTRY_PASSWORD" | helm registry login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - helm push "dist/release-board-${CHART_VERSION}.tgz" "oci://${CI_REGISTRY_IMAGE}/charts"
    - 'printf "CHART_VERSION=%s\nIMAGE_DIGEST=%s\n" "$CHART_VERSION" "$IMAGE_DIGEST" > release.env'
    - cat release.env
  artifacts:
    reports:
      dotenv: release.env
    paths: [dist/*.tgz, release.env]
    expire_in: 1 week

deploy-student:
  extends: [.helm, .on-default]
  stage: deploy
  needs: [publish-chart]
  interruptible: false
  resource_group: student-$CI_PROJECT_ID
  script:
    - sh ci/deploy.sh
  environment:
    name: student
    url: http://$APP_HOST
    on_stop: stop-student
  artifacts:
    when: always
    paths: [diagnostics/, smoke-response.json]
    expire_in: 1 week

stop-student:
  extends: .helm
  stage: cleanup
  needs: []
  interruptible: false
  resource_group: student-$CI_PROJECT_ID
  script:
    - 'test -n "$KUBE_CONTEXT" && test "$KUBE_NAMESPACE" != default'
    - helm uninstall "$RELEASE" --namespace "$KUBE_NAMESPACE" --kube-context "$KUBE_CONTEXT" --wait
  environment:
    name: student
    action: stop
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  allow_failure: true
