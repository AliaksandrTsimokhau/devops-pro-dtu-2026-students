{{- $namespace := required "Set targetNamespace=full-cycle-<project-id>" .Values.targetNamespace }}
{{- if not (hasPrefix "full-cycle-" $namespace) }}
{{- fail "targetNamespace must start with full-cycle-" }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  annotations:
    helm.sh/resource-policy: keep
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: release-board-agent
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-board-deployer
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, secrets, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-board-deployer
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-board-deployer
subjects:
  - kind: ServiceAccount
    name: release-board-agent
    namespace: {{ .Release.Namespace }}
