{{- if eq .Release.Namespace "default" }}
{{- fail "Use a dedicated namespace, not default" }}
{{- end }}
{{- define "release-board.selector" }}
app.kubernetes.io/name: release-board
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- define "release-board.image" -}}
{{ .Values.image.repository }}@{{ .Values.image.digest }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "release-board.selector" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "release-board.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "release-board.selector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.registryCredentials.create }}
      imagePullSecrets:
        - name: {{ .Release.Name }}-registry
      {{- end }}
      containers:
        - name: web
          image: {{ include "release-board.image" . | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: APP_RELEASE
              value: {{ .Chart.Version | quote }}
            - name: APP_PIPELINE_URL
              value: {{ .Values.pipelineURL | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 0
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessPath | quote }}
              port: http
            initialDelaySeconds: 1
            periodSeconds: 3
            timeoutSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    {{- include "release-board.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "release-board.selector" . | nindent 6 }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port: {name: http}
{{- end }}
{{- if .Values.registryCredentials.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-registry
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict .Values.registryCredentials.server (dict "username" .Values.registryCredentials.username "password" .Values.registryCredentials.password "auth" (printf "%s:%s" .Values.registryCredentials.username .Values.registryCredentials.password | b64enc))) | toJson | b64enc | quote }}
{{- end }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  {{- if .Values.registryCredentials.create }}
  imagePullSecrets:
    - name: {{ .Release.Name }}-registry
  {{- end }}
  containers:
    - name: check
      image: {{ include "release-board.image" . | quote }}
      command: [/release-board]
      args: [check, --url, {{ printf "http://%s:8080" .Release.Name | quote }}, --version, {{ .Chart.AppVersion | quote }}]
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
